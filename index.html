<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>GitHub Commits Viewer</title>
    <link rel="icon" type="image/png" href="assets/favicon.ico">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card + .card {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">🔍 Visualizador de Commits do GitHub</h2>

        <form id="gitHubForm" class="form-inline justify-content-center mb-4">
            <input type="text" id="usernameInput" class="form-control mr-2 mb-2" placeholder="GitHub Username" required>
            <input type="text" id="repoInput" class="form-control mr-2 mb-2" placeholder="Nome do Repositório" required>
            <button type="submit" class="btn btn-primary mb-2">Buscar Commits</button>
        </form>

        <div id="userRepos"></div>
    </div>

    <script src="app.js"></script>
</body>

</html>
